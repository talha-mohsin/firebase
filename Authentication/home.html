    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Update profile</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <h6>Profile Image:</h6>
                    <input type="text" placeholder="Picture url" id="profileImg">
                <hr>
                    <h6>Profile Name:</h6>
                    <input type="text" placeholder="Enter your name" id="profileName">
                <hr>
                    <h6>Profile Description:</h6>
                    <textarea cols="40" placeholder="Write about yourself" id="profileDes"></textarea>
                <hr>
                    <h6>Email Address:</h6>
                    <input type="text" placeholder="Email" id="email">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal" id="saveChangesBtn">Save changes</button>
                </div>
            </div>
        </div>
    </div>
