<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs Search | Talent Hub</title>
    <link rel="shortcut icon" href="../assets/logo.png">
    <link rel="stylesheet" href="../utility.css">
    <link rel="stylesheet" href="style2.css">
</head>

<body>

    <header>
        <h1>Talent Hub</h1>

        <nav class="desktopNav">
            <a href="../index.html">Home</a>
            <a href="job.html">Jobs</a>
            <a href="../profiles/profile.html">Hire Talent</a>
            <a href="../auth/login.html" id="loginBtn">Login</a>
        </nav>
        <i class="fa-solid fa-bars" id="menuToggle"></i>
    </header>

    <!-- MOBILE SIDEBAR -->
    <div class="responsiveNav" id="responsiveNav">
        <a href="index.html">Home</a>
        <a href="./job/job.html">Jobs</a>
        <a href="./profiles/profile.html">Hire Talent</a>
        <a href="./auth/login.html">Login</a>
    </div>

    <!-- profile btn -->
    <!-- <div class="profileBtn">
        
    </div> -->

    <div class="userDP">
        <img src="../assets/joining/userProfile.png" alt="">
    </div>

    <div class="jobCards">

    </div>

    <!-- inputModal -->
    <div class="talentFormBg">
        <form class="talentForm" id="talentForm">
            <span class="crossBtn">
                <i class="fa-solid fa-xmark"></i>
            </span>
            <!-- Full Name -->
            <div class="formGroup">
                <label>Full Name</label>
                <input type="text" id="talentName" placeholder="Enter your name" required />
            </div>

            <!-- Role -->
            <div class="formGroup">
                <label>Professional Role</label>
                <input type="text" id="talentRole" placeholder="Frontend Developer" required />
            </div>

            <!-- Skills -->
            <div class="formGroup">
                <label>Skills (comma separated)</label>
                <input type="text" id="talentSkills" placeholder="HTML, CSS, JavaScript, React" required />
            </div>

            <!-- Bio -->
            <div class="formGroup">
                <label>Short Bio</label>
                <textarea id="talentBio" rows="4" placeholder="Tell something about yourself..." required></textarea>
            </div>

            <!-- Profile Image -->
            <div class="formGroup">
                <label>Profile Image</label>
                <input type="file" id="talentImg" accept="image/*" required />
            </div>

            <!-- Submit -->
            <button type="submit" class="submitBtn">Save Profile</button>

        </form>
    </div>

    <script type="module" src="job.js"></script>
    <script src="../utility.js"></script>
    <script src="https://kit.fontawesome.com/df5205f864.js" crossorigin="anonymous"></script>
</body>

</html>
